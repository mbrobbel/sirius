[package]
name = "sirius"
version.workspace = true
edition.workspace = true
description = "Safe, idiomatic Rust bindings for Sirius, the GPU-native SQL engine."
license = "Apache-2.0"
# Transitively links a local Sirius build-tree artifact; not for crates.io.
publish = false

[features]
default = ["arrow-59"]
# Select the Arrow version used by the public result type. Database integrations should choose
# the version used by their host process and disable default features when selecting Arrow 58.
arrow-58 = ["dep:arrow-array-58", "dep:arrow-schema-58"]
arrow-59 = ["dep:arrow-array-59", "dep:arrow-schema-59"]
# Forwarded to sirius-sys: link the self-contained libsirius.a (no runtime deps)
# instead of the default libsirius.so. See sirius-sys for details.
static = ["sirius-sys/static"]

[dependencies]
cxx.workspace = true
sirius-sys.workspace = true
# Results are returned over the Arrow C Data Interface. The selected version must match the host
# consumer so the public `RecordBatch` type unifies. `ffi` provides the Arrow stream reader.
arrow-array-58 = { package = "arrow-array", version = "=58.2.0", features = ["ffi"], optional = true }
arrow-schema-58 = { package = "arrow-schema", version = "=58.2.0", optional = true }
arrow-array-59 = { package = "arrow-array", version = "59", features = ["ffi"], optional = true }
arrow-schema-59 = { package = "arrow-schema", version = "59", optional = true }

[dev-dependencies]
# Building a `local_files` Substrait plan + a parquet fixture for the execute test.
substrait = "0.63"
prost = "0.14"
parquet = "59"
tempfile = "3"
