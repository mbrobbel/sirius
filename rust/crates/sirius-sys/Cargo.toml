[package]
name = "sirius-sys"
version.workspace = true
edition.workspace = true
description = "Low-level cxx (cxx.rs) bindings to the Sirius C++ API."
license = "Apache-2.0"
# Links a local Sirius build-tree artifact; not self-contained for crates.io.
publish = false

[lib]
name = "sirius_sys"

[features]
# Link `libsirius.a` instead of `libsirius.so`. Native dependencies must be
# supplied separately; Cargo does not consume CMake's static target metadata.
# Point SIRIUS_BUILD_DIR at the build tree that has the artifact.
static = []

[dependencies]
cxx.workspace = true

[build-dependencies]
cxx-build.workspace = true
