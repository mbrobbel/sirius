[package]
name = "sirius-sys"
version.workspace = true
edition.workspace = true
description = "Low-level cxx (cxx.rs) bindings to the Sirius C++ API."
license = "Apache-2.0"
# Requires an installed native Sirius library.
publish = false

[lib]
name = "sirius_sys"

[features]
# Use the combined archive and its declared platform/driver dependencies.
# SIRIUS_PREFIX selects the installed Sirius package.
static = []

[dependencies]
cxx.workspace = true

[build-dependencies]
cxx-build.workspace = true
