[workspace]
name = "sirius-package"
channels = ["rapidsai", "conda-forge"]
platforms = [{ name = "cuda13", platform = "linux-64", cuda = "13" }]
requires-pixi = ">=0.81"
preview = ["pixi-build"]
build-variants-files = ["variants.yaml"]

[package]
name = "sirius"
version = "0.0.0"

[package.build]
backend = { name = "pixi-build-rattler-build", version = "==0.4.6", channels = ["conda-forge"] }

[package.build.config]
# Exclude generated outputs and extension sources from the library cache inputs.
extra-input-globs = [
  "!../../build/**",
  "!../../sirius-duckdb/**",
  "!../../vcpkg/**",
  "!../../telemetry_data/**",
  "!../../log/**",
  "!../../runs/**",
  "!../../test_datasets/**",
  "!**/target/**",
]
