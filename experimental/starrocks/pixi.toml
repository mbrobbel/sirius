[workspace]
channels = ["rapidsai","conda-forge"]
name = "sirius-starrocks"
platforms = ["linux-64","linux-aarch64"]

[environments]
default = ["fe","cn","client","engine","nixl"]
cn = ["cn"]
fe = ["fe"]
client = ["client"]
engine = ["engine"]
nixl = ["nixl","engine"]

[tasks]
cluster = {cmd = """
bash -lc 'set -euo pipefail

cleanup() {
    status=$?
    trap - EXIT INT TERM
    kill "${fe_pid:-}" "${cn_pid:-}" 2>/dev/null || true
    wait "${fe_pid:-}" "${cn_pid:-}" 2>/dev/null || true
    exit "${status}"
}
trap cleanup EXIT INT TERM

starrocks/output/fe/bin/start_fe.sh --logconsole &
fe_pid="$!"

target/release/sirius-starrocks-cn &
cn_pid="$!"

wait -n "${fe_pid}" "${cn_pid}"
'
""",cwd = ".",depends-on = ["fe-build","cn-build"],description = "Run the local StarRocks FE and Rust CN in the foreground with logs"}

[feature.client.dependencies]
# Provides the `mysql` CLI that speaks the FE's MySQL wire protocol on query_port.
mysql-client = "*"

[feature.client.tasks]
client = {cmd = "mysql --host 127.0.0.1 --port 9030 --user root",description = "Open a MySQL client against the local FE (run `cluster` in another terminal first)"}

[feature.cn.dependencies]
# Provides protoc for prost-build in the Substrait crates on fresh CN envs.
libprotobuf = ">=7.35,<8"
rust = "*"
thrift-compiler = "*"

# Toolchain to build nixl from source and link nixl-sys. Kept out of the `cn`
# feature so the CPU-only `--no-default-features` CI env stays lean. clangdev drives
# nixl-sys' bindgen; meson/ninja/pkg-config/pybind11/ucx build the nixl C++ library.
# Note: nixl-sys' build.rs compiles its wrapper with the system `g++` against
# /usr/include, so a host C++ toolchain is required (as on standard Linux/CI images).
[feature.nixl.dependencies]
clangdev = "*"
meson = ">=1.0"
ninja = "*"
pkg-config = "*"
pybind11 = "*"
ucx = ">=1.20"

# nixl-sys' build.rs reads NIXL_PREFIX to find the nixl install (headers + libs).
# NIXL_NO_STUBS_FALLBACK makes a missing nixl a hard error for every nixl-feature
# build (not just the cn tasks), so it can never silently cache a dlopen-stub build
# that a later build reuses.
[feature.nixl.activation.env]
NIXL_PREFIX = "$CONDA_PREFIX"
NIXL_NO_STUBS_FALLBACK = "1"

[feature.cn.tasks]
# Build libsirius from source via the repo-root build (creates build/release, which
# sirius-sys links by default).
engine-build = {cmd = "pixi run --manifest-path pixi.toml make",cwd = "../..",description = "Build the Sirius engine (libsirius) from source for the CN to link"}

# Engine-linked CN (default `sirius-engine` feature); needs the engine artifact and
# the `engine` feature's toolchain/libs (in the default env). nixl-build installs
# nixl first; the nixl feature's NIXL_NO_STUBS_FALLBACK forces a real native link.
cn-build = {cmd = "cargo build --release -p sirius-starrocks-cn",depends-on = ["engine-build", "nixl-build"],description = "Build the engine-linked StarRocks CN release binary"}
cn-test = {cmd = "cargo test -p sirius-starrocks-cn",depends-on = ["engine-build", "nixl-build"],description = "Run engine-linked StarRocks CN tests"}
cn-run = {cmd = "cargo run -p sirius-starrocks-cn --",depends-on = ["engine-build", "nixl-build"],description = "Run the engine-linked StarRocks CN with local FE defaults"}

# Pure-Rust path (no engine, GPU, or nixl). What CI runs: --no-default-features
# drops both the `sirius-engine` and `nixl` features, so no C++/CUDA toolchain.
cn-test-no-engine = {cmd = "cargo test -p sirius-starrocks-cn --no-default-features",description = "Run Rust StarRocks CN tests without the embedded Sirius engine"}

[feature.nixl.tasks]
# Build the nixl C++ library (UCX backend) from the pinned submodule into the conda
# prefix so nixl-sys links it at build time (NIXL_PREFIX=$CONDA_PREFIX). The stamp
# records the built submodule commit so a partial/interrupted install or a submodule
# bump forces a rebuild instead of being skipped.
nixl-build = {cmd = """bash -lc 'set -euo pipefail
src="$PIXI_PROJECT_ROOT/thirdparty/nixl"
builddir="$PIXI_PROJECT_ROOT/target/nixl"
stamp="$CONDA_PREFIX/.nixl-build-stamp"
rev="$(git -C "$src" rev-parse HEAD)"
if [ -f "$stamp" ] && [ "$(cat "$stamp")" = "$rev" ]; then echo "nixl $rev already installed"; exit 0; fi
arch=$([ "$(uname -m)" = aarch64 ] && echo sbsa-linux || echo x86_64-linux)
rm -rf "$builddir"
# Build asio/abseil from nixl'"'"'s pinned wraps: the conda versions are newer than
# nixl 1.3.0 supports (asio drops io_context::post; abseil deprecations trip werror).
meson setup "$builddir" "$src" --prefix="$CONDA_PREFIX" --libdir=lib --buildtype=release \\
  --force-fallback-for=asio,abseil-cpp \\
  -Ducx_path="$CONDA_PREFIX" \\
  -Dcudapath_inc="$CONDA_PREFIX/targets/$arch/include" \\
  -Dcudapath_lib="$CONDA_PREFIX/targets/$arch/lib" \\
  -Dcudapath_stub="$CONDA_PREFIX/targets/$arch/lib/stubs" \\
  -Denable_plugins=UCX -Dbuild_tests=false -Dbuild_examples=false
meson compile -C "$builddir"
meson install -C "$builddir"
echo "$rev" > "$stamp"'
""",cwd = ".",description = "Build the nixl C++ library (UCX backend) from the pinned submodule into the conda prefix"}

# Toolchain + libs to compile and link the engine-linked CN, copied from the
# repo-root pixi.toml so this env can build/run it. Kept in sync with that file.
[feature.engine.system-requirements]
cuda = "13"

[feature.engine.dependencies]
cxx-compiler = "*"
cuda-version = "13.2.*"
# nvcc: nixl's meson build compiles CUDA sources for the UCX backend.
cuda-nvcc = "*"
libcudf = "26.06.*"
librmm = "*"
libcurand-dev = "*"
yaml-cpp = "*"
libabseil = "*"
duckdb = "=1.5.3"
spdlog = "1.8.*"
sqlite = "3.*"
liburing = "*"
openssl = "*"
libcurl = "*"

[feature.fe.dependencies]
bash = "*"
coreutils = "*"
findutils = "*"
gawk = "*"
gcc = ">=12.1"
git = "*"
grep = "*"
libprotobuf = "*"
make = "*"
maven = ">=3.9"
openjdk = "17.*"
python = "3.11.*"
sed = "*"
thrift-compiler = "0.20.*"
util-linux = "*"
which = "*"

[feature.fe.tasks]
fe-clean = {cmd = """
bash -lc 'set -e
rm -rf output/fe output/LICENSE.txt output/NOTICE.txt fe/*/target fe/plugin/*/target java-extensions/target java-extensions/hadoop-ext/target
rm -f fe/plugin/hive-udf/dependency-reduced-pom.xml fe/plugin/spark-dpp/dependency-reduced-pom.xml'
""",cwd = "starrocks",description = "Remove generated StarRocks FE build artifacts"}

fe-run = {cmd = "output/fe/bin/start_fe.sh --logconsole",cwd = "starrocks",depends-on = ["fe-build"],description = "Run the packaged StarRocks FE in the foreground"}

fe-build = {cmd = """
bash -lc 'set -e
notice_script="build-support/gen_notice.py"
notice_backup="$(mktemp)"
cp "$notice_script" "$notice_backup"
restore_notice() {
    status=$?
    trap - EXIT
    cp "$notice_backup" "$notice_script"
    rm -f "$notice_backup"
    exit "$status"
}
trap restore_notice EXIT
sed -i "1s|^.*$|#!/usr/bin/env python3|" "$notice_script"

thirdparty="${PIXI_PROJECT_ROOT}/.pixi/starrocks-fe-thirdparty"
mkdir -p "${thirdparty}/installed/llvm/lib"
touch "${thirdparty}/installed/llvm/lib/libLLVMInstCombine.a"
STARROCKS_THIRDPARTY="${thirdparty}" ./build.sh --fe --with-maven-batch-mode ON
cp ../conf/fe.conf output/fe/conf/fe.conf'
""",
cwd = "starrocks",inputs = [
    "conf/fe.conf",
    "starrocks/build.sh",
    "starrocks/env.sh",
    "starrocks/build-support/build_helpers.sh",
    "starrocks/build-support/gen_notice.py",
    "starrocks/bin/*_fe.sh",
    "starrocks/bin/show_fe_version.sh",
    "starrocks/bin/common.sh",
    "starrocks/conf/cluster_snapshot.yaml",
    "starrocks/conf/core-site.xml",
    "starrocks/conf/fe.conf",
    "starrocks/conf/hadoop_env.sh",
    "starrocks/conf/udf_security.policy",
    "starrocks/fe/checkstyle.xml",
    "starrocks/fe/pom.xml",
    "starrocks/fe/*/pom.xml",
    "starrocks/fe/*/src/**/*",
    "starrocks/fe/plugin/*/pom.xml",
    "starrocks/fe/plugin/*/src/**/*",
    "starrocks/gensrc/Makefile",
    "starrocks/gensrc/proto/**/*",
    "starrocks/gensrc/script/**/*",
    "starrocks/gensrc/thrift/**/*",
    "starrocks/java-extensions/pom.xml",
    "starrocks/java-extensions/hadoop-ext/pom.xml",
    "starrocks/java-extensions/hadoop-ext/src/**/*",
    "starrocks/webroot/**/*",
    "starrocks/LICENSE.txt",
    "starrocks/licenses/**/*",
    "starrocks/licenses-binary/**/*",
],outputs = [
    "starrocks/output/LICENSE.txt",
    "starrocks/output/NOTICE.txt",
    "starrocks/output/fe/bin/*.sh",
    "starrocks/output/fe/conf/*",
    "starrocks/output/fe/hive-udf/*.jar",
    "starrocks/output/fe/lib/*.jar",
    "starrocks/output/fe/spark-dpp/*.jar",
    "starrocks/output/fe/webroot/**/*",
],description = "Build and package the StarRocks FE into starrocks/output/fe"}
