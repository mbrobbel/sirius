[package]
name = "sirius-datafusion"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[[bin]]
name = "sirius-datafusion"
path = "src/main.rs"
required-features = ["sirius-engine"]

[[bin]]
name = "sirius-dfbench"
path = "src/bin/sirius-dfbench.rs"
required-features = ["sirius-engine"]

[features]
default = ["sirius-engine"]
sirius-engine = [
    "dep:sirius",
]

[dependencies]
anyhow = "1"
arrow-array = "=58.2.0"
arrow-schema = "=58.2.0"
clap = { version = "4", features = ["derive"] }
datafusion = { version = "=53.1.0", default-features = false, features = [
    "datetime_expressions",
    "parquet",
    "sql",
    "unicode_expressions",
] }
datafusion-substrait = { version = "=53.1.0", default-features = false }
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sirius = { path = "../../rust/crates/sirius", optional = true, default-features = false, features = ["arrow-58"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
parquet = "=58.2.0"
tempfile = "3"
