[workspace]
name = "sirius-sqltest"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

[dependencies]
rust = ">=1.94,<2"
cmake = ">=3.30,<4"
ninja = ">=1.12,<2"
cxx-compiler = ">=1.9,<2"
python = ">=3.12,<3.15"
git = ">=2.47,<3"
libduckdb = "==1.5.6"
libduckdb-devel = "==1.5.6"

[tasks]
cargo = { cmd = "cargo", cwd = "../.." }
