version = 1
default_run = "local"
suite_roots = ["suites"]

[storage.native]
relation = "table"

[storage.parquet]
relation = "view"

[profiles.one-gpu]
gpus = 1
config = "profiles/one-gpu.yaml"
environment = { SIRIUS_ENABLE_TEST_OPTIONS = "1" }

[profiles.two-gpu]
gpus = 2
config = "profiles/two-gpu.yaml"
environment = { SIRIUS_ENABLE_TEST_OPTIONS = "1" }

[fixtures.tpch]
extensions = ["tpch"]
sql = ["fixtures/prepare/tpch.sql"]
tables = ["customer", "lineitem", "nation", "orders", "part", "partsupp", "region", "supplier"]

[fixtures.tpcds]
extensions = ["tpcds"]
sql = ["fixtures/prepare/tpcds.sql"]
tables = ["call_center", "catalog_page", "catalog_returns", "catalog_sales", "customer", "customer_address", "customer_demographics", "date_dim", "household_demographics", "income_band", "inventory", "item", "promotion", "reason", "ship_mode", "store", "store_returns", "store_sales", "time_dim", "warehouse", "web_page", "web_returns", "web_sales", "web_site"]

[fixtures.clickbench]
sources = ["hits"]
sql = ["fixtures/clickbench-schema.sql", "fixtures/prepare/clickbench.sql"]
tables = ["hits"]

[sources.hits]
kind = "download"
compression = "gzip"
url = "https://pages.cs.wisc.edu/~yxy/sirius-datasets/test_hits.tsv.gz"
sha256 = "e852e982eda2e5119b9a4aed460de4a1422fa80b341b9c9b00a0c755d224cba4"

[axes.gpu.one]
profile = "one-gpu"

[axes.gpu.two]
profile = "two-gpu"

[axes.storage.native]
storage = "native"

[axes.storage.parquet]
storage = "parquet"

[axes.optimizers.default]

[axes.optimizers.fixed-joins]
settings = { disabled_optimizers = "join_order,build_side_probe_side" }

[runs.local]
suites = "all"
exclude_suites = ["csv_disabled", "compressed_materialization_gate", "compressed_materialization_partition"]
axes = { gpu = ["one"], storage = ["native"], optimizers = ["default"] }

[runs.smoke]
suites = ["regressions"]
axes = { gpu = ["one"], storage = ["native"], optimizers = ["default"] }

[runs.correctness]
suites = "all"
exclude_suites = ["csv_disabled", "tpch", "tpcds", "clickbench"]
profile = "integration-one-gpu"

[runs.benchmarks]
suites = ["tpch", "tpcds", "clickbench"]
axes = { gpu = ["one"], storage = "all", optimizers = ["default"] }

[runs.matrix]
suites = "all"
exclude_suites = ["csv_disabled", "compressed_materialization_gate", "compressed_materialization_partition"]
axes = { gpu = ["one", "two"], storage = "all", optimizers = ["default"] }

[runs.optimizer-sweep]
suites = "all"
exclude_suites = ["csv_disabled", "compressed_materialization_gate", "compressed_materialization_partition"]
axes = { gpu = ["one"], storage = ["native"], optimizers = "all" }

[runs.full-sweep]
suites = "all"
axes = { gpu = "all", storage = "all", optimizers = "all" }

[sources.tpch-original]
kind = "file"
path = "../cpp/integration/data/duckdb/integration.duckdb"
sha256 = "3f8114e22324a5b8f1457ad13d9e2aa2c1720b5514061cef7ecd7608c397b841"

[fixtures.tpch-native-original]
files = { "integration.duckdb" = "tpch-original" }

[fixtures.tpch-parquet-original]
files = {"customer.parquet" = "tpch-parquet-customer", "lineitem.parquet" = "tpch-parquet-lineitem", "nation.parquet" = "tpch-parquet-nation", "orders.parquet" = "tpch-parquet-orders", "part.parquet" = "tpch-parquet-part", "partsupp.parquet" = "tpch-parquet-partsupp", "region.parquet" = "tpch-parquet-region", "supplier.parquet" = "tpch-parquet-supplier"}

[sources.tpch-parquet-customer]
kind = "file"
path = "../cpp/integration/data/parquet/customer.parquet"
sha256 = "b0e9a65d3cc4c28e18f12ef8c50171cf115eab6d4af62dc350225ae1df4e7c61"

[sources.tpch-parquet-lineitem]
kind = "file"
path = "../cpp/integration/data/parquet/lineitem.parquet"
sha256 = "edce38165297e935631fa4d0c7d88d72a6c20acce9ad594fb76a8b890e987e05"

[sources.tpch-parquet-nation]
kind = "file"
path = "../cpp/integration/data/parquet/nation.parquet"
sha256 = "25ee85f9da121f4e23d11af314bff989d6134cdc1b21d92fc59253bd667cd3e3"

[sources.tpch-parquet-orders]
kind = "file"
path = "../cpp/integration/data/parquet/orders.parquet"
sha256 = "eb1745544b8e0fc6e0578799418c4b8bbd52b5f712a1a318ff8e4f4ca5f80c72"

[sources.tpch-parquet-part]
kind = "file"
path = "../cpp/integration/data/parquet/part.parquet"
sha256 = "2a52c16e9d5f37a406fcd5313d897ca4b7ab65db4ac36de0ba1a5013ec21daae"

[sources.tpch-parquet-partsupp]
kind = "file"
path = "../cpp/integration/data/parquet/partsupp.parquet"
sha256 = "6459afef8776dc97384fce066e8ea4bdff5ea54bf8c8a8392e444eed3d75b127"

[sources.tpch-parquet-region]
kind = "file"
path = "../cpp/integration/data/parquet/region.parquet"
sha256 = "0dec3f557154afd88b3dd29418de8878a6c16a009af4f73cbed827a7c5bc71d6"

[sources.tpch-parquet-supplier]
kind = "file"
path = "../cpp/integration/data/parquet/supplier.parquet"
sha256 = "ecd25c4af4b5d65f4f80012f5dc301ae6b657a8029d0dfb915fc88b43b70c34e"

[runs.previously-disabled]
suites = ["csv_disabled"]
axes = { gpu = ["integration-one"], storage = "all", optimizers = ["default"] }

[profiles.integration-one-gpu]
gpus = 1
config = "profiles/integration-one-gpu.yaml"
environment = { SIRIUS_ENABLE_TEST_OPTIONS = "1", SIRIUS_EXP_FUSED_SCAN_FILTER = "1", SIRIUS_EXP_FUSED_SCAN_MAX_SEL = "1", SIRIUS_EXP_FUSED_SCAN_TIERB_MAX_SEL = "1" }

[axes.gpu.integration-one]
profile = "integration-one-gpu"

[profiles.integration-two-gpu]
gpus = 2
config = "profiles/integration-two-gpu.yaml"
environment = { SIRIUS_ENABLE_TEST_OPTIONS = "1", SIRIUS_EXP_FUSED_SCAN_FILTER = "1", SIRIUS_EXP_FUSED_SCAN_MAX_SEL = "1", SIRIUS_EXP_FUSED_SCAN_TIERB_MAX_SEL = "1" }

[axes.gpu.integration-two]
profile = "integration-two-gpu"

[profiles.compressed-materialization-gate]
gpus = 1
config = "profiles/compressed-materialization-gate.yaml"
environment = { SIRIUS_ENABLE_TEST_OPTIONS = "1" }

[axes.gpu.compressed-gate]
profile = "compressed-materialization-gate"

[runs.compressed-gate]
suites = ["compressed_materialization_gate"]
profile = "compressed-materialization-gate"

[profiles.compressed-materialization-partition]
gpus = 1
config = "profiles/compressed-materialization-partition.yaml"
environment = { SIRIUS_ENABLE_TEST_OPTIONS = "1" }

[axes.gpu.compressed-partition]
profile = "compressed-materialization-partition"

[runs.compressed-partition]
suites = ["compressed_materialization_partition"]
profile = "compressed-materialization-partition"
