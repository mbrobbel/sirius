sirius:
  topology:
    num_gpus: 1
  memory:
    gpu:
      # Explicit cap, not a fraction: these integration tests run TPC-H SF0.1 /
      # ~50k-row sorts whose measured peak GPU pool usage is ~294 MiB (largest
      # single allocation ~470 MiB). 2 GiB gives ~4x headroom. The previous
      # usage_limit_fraction (0.5) eagerly reserved ~half the device (~51 GiB on
      # a 96 GiB card), which both wasted setup time and made the suite OOM-prone
      # under any concurrent GPU use; the byte cap is applied lazily.
      usage_limit_bytes: 2 GiB
      reservation_limit_fraction: 1.0
    host:
      capacity_bytes: 32000000000
      initial_number_pools: 10
      pool_size: 512
      block_size: 1048576
  executor:
    pipeline:
      num_threads: 4
    duckdb_scan:
      num_threads: 2
    task_creator:
      num_threads: 2
    downgrade:
      num_threads: 1
      monitor_period_ms: 10
  operator_params:
    scan_task_batch_size: 100000000
    default_scan_task_varchar_size: 256
    max_sort_partition_bytes: 0
    hash_partition_bytes: 100000000
    concat_batch_bytes: 100000000
    max_build_hash_table_bytes: 90000000
