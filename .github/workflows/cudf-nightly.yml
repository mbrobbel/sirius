# NOTICE - Actions permissions policy (Settings > Actions > General):
#   - "Allow sirius-db, and select non-sirius-db, actions and reusable workflows"
#     - Allow actions created by GitHub: YES (covers actions/*)
#     - Allow actions by Marketplace verified creators: NO
#     - Explicitly allowed third-party actions:
#       prefix-dev/setup-pixi@*
#       mozilla-actions/sccache-action@*
#     - Require actions to be pinned to a full-length commit SHA: NO
#
# Adding a new action? You must:
#   1. Pin it to a full-length commit SHA (e.g. uses: owner/repo@<40-char-sha> # vX.Y.Z)
#   2. If it is not from sirius-db, GitHub, or the explicitly allowed third-party actions above, add it to the
#      project-level allowlist above before merging
name: cuDF Nightly

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (arm64, gcc, release, nightly)
    runs-on: ${{ fromJSON('["self-hosted", "ubuntu-24.04", "arm-lg"]') }}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      CONDA_OVERRIDE_CUDA: "13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Init build submodules
        run: git submodule update --init --depth=1 --jobs 3 duckdb substrait cucascade

      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          cache: false
          pixi-version: v0.71.1
          environments: nightly-runner
          activate-environment: false

      - name: Configure sccache backend
        run: |
          if [[ -n "${SCCACHE_BUCKET}" ]]; then
            echo "SCCACHE_BUCKET DEFINED -> Self Hosted Runner, Disable GHA sccache"
            echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
          else
            echo "SCCACHE_BUCKET UNDEFINED -> GitHub Runner, Enable GHA sccache"
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          fi
          echo "SCCACHE_S3_KEY_PREFIX=sirius" >> "$GITHUB_ENV"

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - name: Build against cuDF nightly
        env:
          CUDAARCHS: "100"
        run: |
          set -o pipefail
          pixi run -e nightly-runner nightly-run make release -j$(nproc) 2>&1 | tee /tmp/build.log

      - name: Surface build errors
        if: failure()
        run: |
          echo '## Build errors' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '(FAILED:|: error:|: fatal error:)' /tmp/build.log | head -60 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
