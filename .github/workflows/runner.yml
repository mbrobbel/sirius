# NOTICE - Actions permissions policy (Settings > Actions > General):
#   - "Allow sirius-db, and select non-sirius-db, actions and reusable workflows"
#     - Allow actions created by GitHub: YES (covers actions/*)
#     - Allow actions by Marketplace verified creators: NO
#     - Explicitly allowed third-party actions:
#       prefix-dev/setup-pixi@*
#       mozilla-actions/sccache-action@*
#     - Require actions to be pinned to a full-length commit SHA: NO
#
# Adding a new action? You must:
#   1. Pin it to a full-length commit SHA (e.g. uses: owner/repo@<40-char-sha> # vX.Y.Z)
#   2. If it is not from sirius-db, GitHub, or the explicitly allowed third-party actions above, add it to the
#      project-level allowlist above before merging
name: Runner

on:
  push:
    branches:
      - dev
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/runner.yml'
      - 'pixi.toml'
      - 'pixi.lock'
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            labels: '["self-hosted", "ubuntu-24.04", "cpu-lg"]'
          - arch: arm64
            labels: '["self-hosted", "ubuntu-24.04", "arm-lg"]'
    name: build (${{ matrix.arch }})
    runs-on: ${{ fromJSON(matrix.labels) }}
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      # CPU runner: no GPU/driver. The workspace platforms are CUDA-pinned; the
      # `rust` env itself is CUDA-agnostic, so assert `__cuda` to resolve it.
      CONDA_OVERRIDE_CUDA: "13"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: false

      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          cache: false
          pixi-version: v0.71.1
          environments: rust

      - name: Configure cache backends
        run: |
          if [[ -n "${SCCACHE_BUCKET}" ]]; then
            echo "SCCACHE_BUCKET DEFINED -> Self Hosted Runner, Disable GHA sccache"
            echo "SCCACHE_GHA_ENABLED=false" >> $GITHUB_ENV
          else
            echo "SCCACHE_BUCKET UNDEFINED -> GitHub Runner, Enable GHA sccache"
            echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          fi

      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      # Scoped to -p sirius-runner: sirius/sirius-sys need the C++ build
      # (covered in check.yml) and the telemetry crates would pull the quent
      # build tree. Workspace resolution still fetches the quent git dep's
      # metadata over HTTPS; nothing from it is built.
      - name: Checks
        run: |
          set -euo pipefail
          pixi run -e rust cargo fmt --manifest-path rust/Cargo.toml -p sirius-runner -- --check
          pixi run -e rust cargo clippy --manifest-path rust/Cargo.toml -p sirius-runner --all-targets --locked -- -D warnings
          pixi run -e rust cargo test --manifest-path rust/Cargo.toml -p sirius-runner --locked

      - name: Build
        run: pixi run -e rust cargo build --manifest-path rust/Cargo.toml -p sirius-runner --release --locked

      # Tar to preserve the executable bit (upload-artifact normalizes file modes).
      - name: Package
        run: tar -cf sirius-runner.tar -C rust/target/release sirius-runner

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sirius-runner-${{ matrix.arch }}
          path: sirius-runner.tar
          retention-days: 14
          if-no-files-found: error

  runner:
    runs-on: ubuntu-slim
    needs: [build]
    if: always()
    steps:
      - name: All checks ok
        if: ${{ needs.build.result == 'success' }}
        run: exit 0
      - name: Some checks failed
        if: ${{ needs.build.result != 'success' }}
        run: exit 1
